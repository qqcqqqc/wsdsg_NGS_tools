name: Build & Publish Release Assets

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }} Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: NGS_Amplicon_Tool_${{ github.ref_name }}_Windows.zip
          - os: ubuntu-latest
            asset_name: NGS_Amplicon_Tool_${{ github.ref_name }}_Linux.tar.gz
          - os: macos-latest
            asset_name: NGS_Amplicon_Tool_${{ github.ref_name }}_macOS.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name NGS_Amplicon_Tool --add-data "assets:assets" app.py

      - name: Package Windows Binary
        if: matrix.os == 'windows-latest'
        run: |
          powershell Compress-Archive -Path dist/NGS_Amplicon_Tool -DestinationPath ${{ matrix.asset_name }}

      - name: Package Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C dist NGS_Amplicon_Tool

      - name: Package macOS Binary
        if: matrix.os == 'macos-latest'
        run: |
          zip -r ${{ matrix.asset_name }} dist/NGS_Amplicon_Tool

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
