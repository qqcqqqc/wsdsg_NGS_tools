name: Build & Publish Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: NGS_Amplicon_Tool.exe
          - os: ubuntu-latest
            asset_name: NGS_Amplicon_Tool_v2.2.0_Linux.tar.gz
          - os: macos-latest
            asset_name: NGS_Amplicon_Tool_v2.2.0_macOS.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Single EXE
        if: matrix.os == 'windows-latest'
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name NGS_Amplicon_Tool --add-data "assets;assets" app.py
          copy dist\NGS_Amplicon_Tool.exe ${{ matrix.asset_name }}

      - name: Build Linux Binary
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m PyInstaller --noconfirm --onedir --name NGS_Amplicon_Tool --add-data "assets:assets" app.py
          tar -czvf ${{ matrix.asset_name }} -C dist NGS_Amplicon_Tool

      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name NGS_Amplicon_Tool --add-data "assets:assets" app.py
          zip -r ${{ matrix.asset_name }} dist/NGS_Amplicon_Tool.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
